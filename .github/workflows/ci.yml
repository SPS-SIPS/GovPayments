name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CONFIGURATION: Release

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore Sps.P2G.sln

      - name: Build
        run: dotnet build Sps.P2G.sln --configuration "$CONFIGURATION" --no-restore

      - name: Test
        run: >
          dotnet test Sps.P2G.sln
          --configuration "$CONFIGURATION"
          --no-build
          --no-restore
          --logger "trx;LogFileName=sps-p2g-tests.trx"
          --results-directory artifacts/test-results

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate production Docker Compose
        run: docker compose --env-file production/.env.example -f production/docker-compose.yml config --quiet

      - name: Validate shell scripts
        run: |
          for script in security/openbao/scripts/*.sh; do
            bash -n "$script"
          done
          bash -n production/scripts/generate-self-signed-cert.sh
          bash -n production/openbao/scripts/bao-compose-bootstrap.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  docker-build:
    name: Build Gateway Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tags
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sps-p2g-gateway"
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
          echo "IMAGE_SHA_TAG=$image_name:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST_TAG=$image_name:latest" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build --pull \
            -t "$IMAGE_SHA_TAG" \
            -t "$IMAGE_LATEST_TAG" \
            .

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push SHA image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE_SHA_TAG"

      - name: Push latest image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_LATEST_TAG"
