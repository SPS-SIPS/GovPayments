name: sps-p2g-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sps_p2g_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-sps_p2g}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  openbao-permissions:
    image: alpine:3.20
    command: >
      sh -c "mkdir -p /security/openbao/data /security/openbao/logs /security/openbao/audit /security/openbao/keys /security/openbao/runtime &&
             chown -R 100:1000 /security/openbao/data /security/openbao/logs /security/openbao/audit &&
             chmod 770 /security/openbao/data /security/openbao/logs /security/openbao/audit &&
             chmod 700 /security/openbao/keys /security/openbao/runtime"
    volumes:
      - ./openbao:/security/openbao

  openbao:
    image: openbao/openbao:2.0.0
    container_name: sps-p2g-prod-openbao
    depends_on:
      openbao-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    read_only: true
    user: "100:1000"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${OPENBAO_HOST_PORT:-8201}:8200"
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config:/bao/config:ro
      - ./openbao/data:/bao/data
      - ./openbao/logs:/bao/logs
      - ./openbao/audit:/bao/audit
    command: server -config=/bao/config/bao.hcl
    healthcheck:
      test: [ "CMD-SHELL", "bao status > /dev/null 2>&1 || [ $$? -eq 2 ]" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  openbao-bootstrap:
    image: openbao/openbao:2.0.0
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      P2G_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB:-sps_p2g_gateway};Username=${POSTGRES_USER:-sps_p2g};Password=${POSTGRES_PASSWORD:-change-this-postgres-password}
      P2G_DESCRIPTOR_HMAC_SECRET: ${P2G_DESCRIPTOR_HMAC_SECRET:-change-this-descriptor-hmac-secret-at-least-32-chars}
      P2G_INTERNAL_API_KEY: ${P2G_INTERNAL_API_KEY:-}
      P2G_KEYCLOAK_ENABLED: "true"
      P2G_KEYCLOAK_AUTHORITY: ${P2G_KEYCLOAK_AUTHORITY:-https://keycloak.example/realms/sps}
      P2G_KEYCLOAK_AUDIENCE: ${P2G_KEYCLOAK_AUDIENCE:-sps-p2g-gateway}
      P2G_KEYCLOAK_REQUIRE_HTTPS_METADATA: ${P2G_KEYCLOAK_REQUIRE_HTTPS_METADATA:-true}
      P2G_KEYCLOAK_REVENUE_AUTHORITY_ROLE: ${P2G_KEYCLOAK_REVENUE_AUTHORITY_ROLE:-p2g-authority}
      P2G_KEYCLOAK_SIPS_CONNECT_ROLE: ${P2G_KEYCLOAK_SIPS_CONNECT_ROLE:-p2g-sips-connect}
      P2G_KEYCLOAK_DASHBOARD_ROLE: ${P2G_KEYCLOAK_DASHBOARD_ROLE:-p2g-dashboard}
      P2G_KEYCLOAK_CONFIGURATION_ADMIN_ROLE: ${P2G_KEYCLOAK_CONFIGURATION_ADMIN_ROLE:-p2g-configuration-admin}
      P2G_KEYCLOAK_SIPS_CONNECT_CLIENT_ID: ${P2G_KEYCLOAK_SIPS_CONNECT_CLIENT_ID:-sips-connect-p2g}
      P2G_AUTH_ALLOW_AUTHORITY_API_KEY_FALLBACK: "false"
      P2G_AUTH_ALLOW_SIPS_CONNECT_INTERNAL_KEY_FALLBACK: "false"
      P2G_CALLBACK_SECURITY_REQUIRE_HTTPS: "true"
      P2G_CALLBACK_SECURITY_ALLOW_PRIVATE_NETWORK_TARGETS: "false"
      P2G_DATA_PROTECTION_KEYS_PATH: /var/lib/sps-p2g-gateway/data-protection-keys
    volumes:
      - ./openbao:/security/openbao
      - ./openbao/scripts/bao-compose-bootstrap.sh:/usr/local/bin/bao-compose-bootstrap.sh:ro
    command: sh /usr/local/bin/bao-compose-bootstrap.sh
    restart: "no"

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/hanadderia/sps-p2g-gateway}:${GATEWAY_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      openbao-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      OpenBao__Enabled: "true"
      OpenBao__BaseUrl: http://openbao:8200
      OpenBao__TokenFile: /run/openbao/gateway_token
      OpenBao__KvMount: secret
      OpenBao__SecretPath: sps-p2g-gateway/runtime
      Database__RunMigrationsOnStartup: ${DATABASE_RUN_MIGRATIONS_ON_STARTUP:-true}
      Callbacks__Enabled: ${CALLBACKS_ENABLED:-true}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - ./gateway/data-protection-keys:/var/lib/sps-p2g-gateway/data-protection-keys
      - ./openbao/runtime:/run/openbao:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
